name: Release

# Push a tag like v1.1.0 to publish that version to npm and the MCP Registry.
# The tag must match the version in package.json and server.json.
# Needs the NPM_TOKEN repository secret. The MCP Registry login uses
# GitHub OIDC, so it needs no secret.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json and server.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srv_pkg=$(node -p "require('./server.json').packages[0].version")
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srv_pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg) / server.json ($srv, $srv_pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
