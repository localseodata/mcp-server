name: Release

# Push a tag like v1.1.0 to publish that version to npm and the MCP Registry.
# The tag must match the version in package.json and server.json.
# It can also be run by hand from the Actions tab ("Run workflow"), which
# publishes the version in package.json from the chosen branch.
# Both publishes authenticate with GitHub OIDC, so no secrets are needed.
# npm must list this workflow as a trusted publisher for the package
# (npmjs.com → package Settings → Trusted Publisher → GitHub Actions,
# repository localseodata/mcp-server, workflow release.yml).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check versions match
        run: |
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srv_pkg=$(node -p "require('./server.json').packages[0].version")
          # A tag push must match the files; a manual run publishes package.json's version.
          want="$pkg"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then want="${GITHUB_REF_NAME#v}"; fi
          if [ "$want" != "$pkg" ] || [ "$want" != "$srv" ] || [ "$want" != "$srv_pkg" ]; then
            echo "::error::Versions disagree: expected $want, package.json $pkg, server.json $srv / $srv_pkg"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      # Skipped when this version is already on npm, so a failed registry
      # step can be retried by running the workflow again.
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$name@$version is already on npm, skipping publish"
          else
            npm publish --access public
          fi

      # npm can take a few minutes to serve a new version, and the MCP
      # Registry rejects one it can't see yet.
      - name: Wait for the version to appear on npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is available"
              exit 0
            fi
            echo "Waiting for $name@$version on npm ($i/30)..."
            sleep 20
          done
          echo "::error::$name@$version did not appear on npm within 10 minutes"
          exit 1

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
