name: Release

# Push a tag like v1.1.0 to publish that version to npm and the MCP Registry.
# The tag must match the version in package.json and server.json.
# Both publishes authenticate with GitHub OIDC, so no secrets are needed.
# npm must list this workflow as a trusted publisher for the package
# (npmjs.com → package Settings → Trusted Publisher → GitHub Actions,
# repository localseodata/mcp-server, workflow release.yml).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json and server.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          srv=$(node -p "require('./server.json').version")
          srv_pkg=$(node -p "require('./server.json').packages[0].version")
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$srv" ] || [ "$tag" != "$srv_pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg) / server.json ($srv, $srv_pkg)"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1
      - name: Publish to npm
        run: npm publish --access public

      - name: Install mcp-publisher
        run: |
          curl -sSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
